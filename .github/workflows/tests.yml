name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: CLI smoke test
        run: |
          clonedisp \
            --input examples/example_labels.csv \
            --output-prefix /tmp/clonedisp_smoke \
            --bootstrap 100
          clonedisp-multi \
            --manifest examples/multi_manifest.csv \
            --output-prefix /tmp/clonedisp_multi_smoke \
            --bootstrap 100
